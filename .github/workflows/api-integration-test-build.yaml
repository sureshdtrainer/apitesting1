name: API Integration Test Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '16 0 * * *'

#Clone/Checkout the project
#Setup the python
#Install all the dependencies which are in the requirements.txt
#pytest with html options
#Check if tests are success or failure and upload the test report

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest and generate HTML report
        run: |
          pytest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./reports/report*.html